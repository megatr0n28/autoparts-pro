<mat-card class="auth-card">


  <mat-card-title>
    Login
  </mat-card-title>


  <mat-card-content>


    <form
      [formGroup]="loginForm"
      (ngSubmit)="submit()"
    >


      <mat-form-field>

        <mat-label>
          Email
        </mat-label>


        <input

          matInput

          formControlName="email"

          type="email"

        />


      </mat-form-field>



      <mat-form-field>


        <mat-label>
          Password
        </mat-label>


        <input

          matInput

          type="password"

          formControlName="password"

        />


      </mat-form-field>



      <button

        mat-raised-button

        color="primary"

        type="submit"

      >

        Login

      </button>


    </form>

    <p class="register-prompt">
      Don't have an account?
      <a routerLink="/register">Register</a>
    </p>


  </mat-card-content>


</mat-card>

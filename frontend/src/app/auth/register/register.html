<mat-card class="auth-card">


<mat-card-title>
Register
</mat-card-title>


<mat-card-content>


<form

[formGroup]="registerForm"

(ngSubmit)="submit()"

>


<mat-form-field>

<mat-label>
First Name
</mat-label>


<input

matInput

formControlName="firstName"

/>

</mat-form-field>



<mat-form-field>

<mat-label>
Last Name
</mat-label>


<input

matInput

formControlName="lastName"

/>

</mat-form-field>



<mat-form-field>

<mat-label>
Email
</mat-label>


<input

matInput

type="email"

formControlName="email"

/>

</mat-form-field>



<mat-form-field>

<mat-label>
Password
</mat-label>


<input

matInput

type="password"

formControlName="password"

/>

</mat-form-field>



<button

mat-raised-button

color="primary"

type="submit"

>

Register

</button>


</form>


</mat-card-content>


</mat-card>

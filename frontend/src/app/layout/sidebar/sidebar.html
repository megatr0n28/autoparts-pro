<aside class="sidebar">
  <nav>
    @for (item of navigationItems; track item.route) {
      <a
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <mat-icon>{{ item.icon }}</mat-icon>

        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
</aside>

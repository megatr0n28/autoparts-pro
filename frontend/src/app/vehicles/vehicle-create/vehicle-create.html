<h2>
Add Vehicle
</h2>


<form
[formGroup]="vehicleForm"
(ngSubmit)="submit()"
>


<input
matInput
placeholder="Year"
formControlName="year"
/>


<input
matInput
placeholder="Make"
formControlName="make"
/>


<input
matInput
placeholder="Model"
formControlName="model"
/>


<input
matInput
placeholder="VIN"
formControlName="vin"
/>


<input
matInput
placeholder="License Plate"
formControlName="license_plate"
/>


<button
mat-raised-button
color="primary"
>

Save

</button>


</form>

<h2>
  Add Vehicle
</h2>

<mat-card
  class="error-card"
  *ngIf="error"
>

  {{ error }}

</mat-card>

<form

  [formGroup]="vehicleForm"

  (ngSubmit)="submit()"

>



<mat-form-field>

  <mat-label>
    Year
  </mat-label>


  <input

    matInput

    type="number"

    formControlName="year"

  />


</mat-form-field>


<div
*ngIf="
vehicleForm.controls['year'].touched &&
vehicleForm.controls['year'].invalid
"
>

  Enter a valid vehicle year.

</div>




<mat-form-field>

  <mat-label>
    Make
  </mat-label>


  <input

    matInput

    formControlName="make"

  />


</mat-form-field>



<mat-form-field>

  <mat-label>
    Model
  </mat-label>


  <input

    matInput

    formControlName="model"

  />


</mat-form-field>


<mat-form-field>

  <mat-label>
    Trim
  </mat-label>

  <input
    matInput
    formControlName="trim"
  />

</mat-form-field>


<mat-form-field>

  <mat-label>
    Engine
  </mat-label>

  <input
    matInput
    formControlName="engine"
  />

</mat-form-field>


<mat-form-field>

  <mat-label>
    Transmission
  </mat-label>

  <input
    matInput
    formControlName="transmission"
  />

</mat-form-field>


<mat-form-field>

  <mat-label>
    Mileage
  </mat-label>

  <input
    matInput
    type="number"
    formControlName="mileage"
  />

</mat-form-field>


<mat-form-field>

  <mat-label>
    Color
  </mat-label>

  <input
    matInput
    formControlName="color"
  />

</mat-form-field>




<mat-form-field>

  <mat-label>
    VIN
  </mat-label>


  <input

    matInput

    formControlName="vin"

  />


</mat-form-field>




<mat-form-field>

  <mat-label>
    License Plate
  </mat-label>


  <input

    matInput

    formControlName="license_plate"

  />


</mat-form-field>

<button

  mat-raised-button

  color="primary"

  type="submit"

  [disabled]="submitting"

>

{{ submitting ? 'Saving...' : 'Save Vehicle' }}


</button>



</form>

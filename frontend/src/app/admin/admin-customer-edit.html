<div class="admin-edit-container">
  <mat-card>
    <mat-card-header><mat-card-title>Admin: Edit Customer</mat-card-title></mat-card-header>
    <mat-card-content>
      @if (loading()) { <p>Loading customer...</p> }
      @else if (error() && !customer) { <p>{{ error() }}</p> }
      @else {
        @if (error()) { <p>{{ error() }}</p> }
        <form [formGroup]="form" (ngSubmit)="save()">
          <mat-form-field><mat-label>First name</mat-label><input matInput formControlName="first_name" /></mat-form-field>
          <mat-form-field><mat-label>Last name</mat-label><input matInput formControlName="last_name" /></mat-form-field>
          <mat-form-field><mat-label>Phone</mat-label><input matInput formControlName="phone" /></mat-form-field>
          <mat-form-field><mat-label>Address line 1</mat-label><input matInput formControlName="address_line1" /></mat-form-field>
          <mat-form-field><mat-label>Address line 2</mat-label><input matInput formControlName="address_line2" /></mat-form-field>
          <mat-form-field><mat-label>City</mat-label><input matInput formControlName="city" /></mat-form-field>
          <mat-form-field><mat-label>State</mat-label><input matInput formControlName="state" /></mat-form-field>
          <mat-form-field><mat-label>Postal code</mat-label><input matInput formControlName="postal_code" /></mat-form-field>
          <div class="actions"><button mat-button type="button" (click)="cancel()">Cancel</button><button mat-raised-button color="primary" type="submit" [disabled]="saving()">{{ saving() ? 'Saving...' : 'Save Changes' }}</button></div>
        </form>
      }
    </mat-card-content>
  </mat-card>
</div>
